<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found, Filery</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
  :root{--bg:#14161A;--panel:#1B1D21;--fg:#EBEBF0;--t2:#A6A8AF;--t3:#83858C;
        --line:#2A2C31;--line2:#3C3F45;--light:#E6E6EC;--amber:#F59F0E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);min-height:100vh;display:flex;
       align-items:center;justify-content:center;text-align:center;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  img{width:88px;height:88px;border-radius:20px}
  .code{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:2.4px;margin-top:22px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-top:8px}
  p{color:var(--t2);margin-top:12px;max-width:420px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  a.btn{background:var(--light);color:#14161A;border-radius:11px;padding:12px 24px;
        text-decoration:none;font-weight:700;font-size:15px}
  a.alt{background:transparent;color:var(--t2);border:1px solid var(--line2)}
  a.alt:hover{border-color:#55585F;color:var(--fg)}
</style>
</head>
<body>
  <div>
    <img src="/icon.png" alt="Filery">
    <div class="code">404</div>
    <h1>Nothing baked here</h1>
    <p>That page does not exist. It may have moved, or the link may be wrong.</p>
    <div class="row">
      <a class="btn" href="/">Back to Filery</a>
      <a class="btn alt" href="https://github.com/jaafarabazid/filery-app">Source on GitHub</a>
    </div>
  </div>
</body>
</html>
