name: Build

# PyInstaller can't cross-compile, so each OS builds on its own runner.
# Push a tag (v0.9.0) to attach the artifacts to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the Release step needs this to create/update releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            name: macOS-arm64
          # Intel is deliberately not built. Every Mac since Nov 2020 is Apple Silicon,
          # and Rosetta only goes x86 -> ARM, so an arm64 build can't serve Intel anyway.
          # If an Intel user ever turns up, add: {os: macos-13, name: macOS-x86_64}
          - os: windows-latest
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"

      - name: Generate icon
        run: python packaging/make_icon.py

      - name: Build
        working-directory: packaging
        run: pyinstaller filery.spec --noconfirm

      - name: Package (macOS -> .dmg)
        if: runner.os == 'macOS'
        run: ./packaging/make_dmg.sh "Filery-${{ matrix.name }}.dmg"

      - name: Package (Windows -> .zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "packaging/dist/Filery/*" -DestinationPath "Filery-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Filery-${{ matrix.name }}
          path: |
            *.dmg
            *.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
            *.zip
