name: Build

# PyInstaller can't cross-compile, so each OS builds on its own runner.
# Push a tag (v0.9.0) to attach the artifacts to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the Release step needs this to create/update releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            name: macOS-arm64
          # Intel is deliberately not built. Every Mac since Nov 2020 is Apple Silicon,
          # and Rosetta only goes x86 -> ARM, so an arm64 build can't serve Intel anyway.
          # If an Intel user ever turns up, add: {os: macos-13, name: macOS-x86_64}
          - os: windows-latest
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Version goes into every artifact filename so downloads never collide in a
      # user's Downloads folder. Tags -> the tag (v0.9.3 -> 0.9.3); other builds
      # get a dev-<sha> label so they can't be mistaken for a release.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"

      - name: Generate icon
        run: python packaging/make_icon.py

      - name: Build
        working-directory: packaging
        run: pyinstaller filery.spec --noconfirm

      - name: Package (macOS -> .dmg)
        if: runner.os == 'macOS'
        run: ./packaging/make_dmg.sh "Filery-${{ steps.ver.outputs.version }}-macOS-arm64.dmg"

      - name: Package (Windows -> Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $out = (Get-Location).Path
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/O$out" "packaging\filery.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Package (Windows -> portable .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "packaging/dist/Filery/*" -DestinationPath "Filery-${{ steps.ver.outputs.version }}-Windows-x64-portable.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: Filery-${{ matrix.name }}
          path: |
            *.dmg
            *.exe
            *.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.dmg
            *.exe
            *.zip
